<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Rotation backtest portal</title>
<style>/*__PORTAL_CSS__*/</style>
</head>
<body>
<div id="loading" class="state-overlay" role="status" aria-live="polite">
  <div class="state-box"><div class="spinner" aria-hidden="true"></div><p>Loading backtest data…</p></div>
</div>

<header class="toolbar" aria-label="Report controls">
  <div class="brand"><strong>Rotation backtest</strong><span id="run-label" class="muted"></span></div>
  <div class="controls">
    <label class="field">
      <span>As of</span>
      <input type="date" id="as-of" aria-describedby="scope-line">
    </label>
    <div class="field" role="group" aria-label="Range preset">
      <span>Range</span>
      <div class="segmented" id="presets">
        <button type="button" data-preset="30D" title="Last 30 calendar days">30D</button>
        <button type="button" data-preset="30S" title="Last 30 trading sessions">30S</button>
        <button type="button" data-preset="MTD" title="Month to date">MTD</button>
        <button type="button" data-preset="YTD" title="Year to date">YTD</button>
        <button type="button" data-preset="ALL" title="All history">All</button>
      </div>
    </div>
    <label class="field">
      <span>From</span>
      <input type="date" id="range-from" title="Custom range start (range ends on the as-of date)">
    </label>
    <label class="field symbol-field">
      <span>Symbol</span>
      <input type="search" id="symbol-filter" list="symbol-list" placeholder="All symbols" autocomplete="off" spellcheck="false">
      <datalist id="symbol-list"></datalist>
    </label>
    <button type="button" id="theme-toggle" class="ghost" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
  </div>
  <div id="scope-line" class="scope-line" aria-live="polite"></div>
</header>

<nav class="tabs" role="tablist" aria-label="Views">
  <button role="tab" data-view="overview">Overview</button>
  <button role="tab" data-view="tradebook">Tradebook</button>
  <button role="tab" data-view="holdings">Holdings</button>
  <button role="tab" data-view="stocks">Stocks</button>
  <button role="tab" data-view="performance">Performance</button>
  <button role="tab" data-view="rankings">Rankings</button>
  <button role="tab" data-view="run">Run details</button>
</nav>

<main id="main">
  <section id="view-overview" class="view" role="tabpanel" aria-label="Overview" hidden></section>
  <section id="view-tradebook" class="view" role="tabpanel" aria-label="Tradebook" hidden></section>
  <section id="view-holdings" class="view" role="tabpanel" aria-label="Holdings" hidden></section>
  <section id="view-stocks" class="view" role="tabpanel" aria-label="Stocks" hidden></section>
  <section id="view-performance" class="view" role="tabpanel" aria-label="Performance" hidden></section>
  <section id="view-rankings" class="view" role="tabpanel" aria-label="Rankings" hidden></section>
  <section id="view-run" class="view" role="tabpanel" aria-label="Run details" hidden></section>
</main>

<footer class="footer muted">
  Read-only report generated by rotation-engine from engine outputs. No trading, no live data.
  Charts: TradingView Lightweight Charts™, Copyright © TradingView, Inc. (https://www.tradingview.com/), Apache-2.0.
</footer>

<script>/*__LIGHTWEIGHT_CHARTS__*/</script>
<script id="portal-data" type="application/json">__PORTAL_DATA__</script>
<script>/*__PORTAL_METRICS__*/</script>
<script>/*__PORTAL_APP__*/</script>
</body>
</html>
