# ---------------------------------------------------------------------------
# Rotation engine configuration
# All strategy parameters live here. Edit and re-run; no code changes needed.
# ---------------------------------------------------------------------------

# Optional first trading date. All history is still loaded (and exported in the
# snapshots), so the lookback window is already warm on this date and the first
# rebalance executes at the open of the first session on/after it. If this date is
# at the very start of the history, the first rebalance runs on the session after
# lookback.days sessions of history exist.
# Example: 2023-01-01
# Leave blank to trade from the start of the available dataset.
start.date=2025-01-01
# start.date=

# end.date=2026-01-01
end.date=

# Trading sessions used to rank relative performance (the momentum lookback).
lookback.days=30

# Number of top-ranked symbols to hold each period.
top.n=5

# Exit rank threshold / maximum book size. Leave blank or 0 to exit a holding as
# soon as it drops out of the top.n (legacy behaviour). When set (must be >= top.n)
# a holding is retained until it falls out of the top exit.n, so the book can grow
# up to exit.n names: the top.n are always entered, and older names linger in the
# buffer (ranks top.n+1 .. exit.n) until they drop out of the top exit.n.
# Example: top.n=5, exit.n=10 -> always hold the top 5, keep prior holdings until
# they fall out of the top 10, holding up to 10 names.
exit.n=

# Starting portfolio capital is derived as capital.per.stock * exit.n (or top.n when
# exit.n is unset): each book slot is funded with capital.per.stock at full capacity.
# Only the top.n names are entered on the first deployment; the reserve funds buffer
# slots as they fill. Set the amount per stock below.

# Target capital allocated to each selected stock at the first deployment.
capital.per.stock=20000

# Optional fixed cash added to the invested principal on the first rebalance of
# each new month (SIP-style top-up). If a rebalance gap skips a calendar month,
# each skipped month is still credited. Only applied in compound allocation mode.
# Set to 0 to disable. Example: 20000
monthly.contribution=

# Intra-period exit criteria to cap losses BETWEEN scheduled rebalances. Both are
# evaluated on each day's CLOSE while a position is held: if the close breaches a
# stop level the position is sold at the NEXT session's open (never same-day) and
# the proceeds sit in cash until the next scheduled rebalance.
#   stop.loss.pct      - hard stop: exit if the close falls this % below the period entry price
#   trailing.stop.pct  - trailing stop: exit if the close falls this % below its peak close since entry
# When both are set the tighter (higher) level triggers first. Set either to 0 to disable.
stop.loss.pct=1
trailing.stop.pct=0

# Rebalance schedule, counted in trading sessions (not calendar dates). The first
# rebalance runs as soon as the lookback window is complete (and not before
# start.date); after that it repeats every N sessions:
#   weekly         - every 5 trading sessions
#   monthly_twice  - every 10 trading sessions (default)
#   monthly        - every 20 trading sessions
# Each switch is decided on the prior session's close and executed at the
# next session's open, so a position can be changed before that day trades.
rebalance.mode=monthly

# Minimum number of daily bars a symbol must have before it becomes eligible.
# The engine enforces max(min.history.days, lookback.days), so a symbol is never
# entered until it has at least `lookback.days` of tracked performance.
min.history.days=5

# Portfolio sizing mode:
#   compound         - reinvest the latest portfolio value each rebalance
#   fixed_principal  - redeploy the same principal every rebalance
allocation.mode=compound

# Top-level strategy run after the daily candles are built. Each strategy is a
# self-contained plug-in (com.rotation.strategy.Strategy) that owns its own execution:
# 'momentum' is the rotation strategy (RotationEngine + its RotationStrategy selection
# layer), which consumes the keys above (rebalance.mode, stop.loss.pct, trailing.stop.pct,
# top.n, exit.n, lookback.days, sector settings). A different strategy shares none of the
# rotation machinery. To add one, implement com.rotation.strategy.Strategy and register it
# in com.rotation.strategy.Strategies, then select it here. Known values: momentum (default), breakout.
strategy=momentum

# Pipeline mode. 'backtest' (default) runs the selected strategy over the full history and
# writes the usual reports/portal. 'scan' runs the end-of-day breakout scanner over the
# latest available session only: it lists every symbol whose close crossed above SMA10,
# flags which ones clear all enabled breakout.* filters (a full entry signal), and writes
# {output.prefix}_scan.csv plus a console summary. The scan always uses the breakout.* rules
# below regardless of the 'strategy' key, and places no trades (a signal would fill at the
# next open, exactly as in the backtest). Known values: backtest (default), scan.
mode=backtest

# ---------------------------------------------------------------------------
# 10 DMA breakout strategy (strategy=breakout)
# Self-contained plug-in; shares none of the rotation keys above. These are inert
# while strategy=momentum. Every threshold is read here, nothing is hard-coded.
# Each filter can be toggled independently to isolate its contribution.
# ---------------------------------------------------------------------------
# Entry: buy the next session's open when the close crosses above the fast SMA and
# all enabled filters pass. Moving-average windows (sessions):
# breakout.sma.fast=10
# breakout.sma.trend.mid=50
# breakout.sma.trend.slow=200
# Trend filter (1): close > mid SMA and > slow SMA, and the mid SMA is higher than
# it was this many sessions ago (rising trend).
# breakout.sma.trend.slope.days=5
# ADX trend-strength filter (2):
# breakout.adx.period=14
# breakout.adx.min=22
# ATR window used by the exit stops (sessions):
# breakout.atr.period=14
# Volume filter (3): cross-day volume above the trailing average of this many prior
# sessions.
# breakout.volume.avg.days=20
# Liquidity filter (5): trailing average traded value (close*volume) over this many
# sessions must exceed the floor (rupees; 50,000,000 = Rs 5 crore).
# breakout.liquidity.avg.days=20
# breakout.liquidity.min.value=50000000
# When more signals fire than open slots, rank by trailing return over this window.
# breakout.rank.lookback.days=126
# Filter toggles (true = enforced). Turn any off to measure its effect.
# breakout.filter.trend=true
# breakout.filter.adx=true
# breakout.filter.volume=true
# breakout.filter.liquidity=true
# Exits are evaluated on the close and filled at the next open, except the hard stop
# (E) which is intraday: a gap-down below the stop fills at the open. Each exit can be
# toggled to isolate a single rule (e.g. for ablation).
# breakout.exit.close.below.fast=true   # A: close below the fast SMA
# breakout.exit.far.or.consec=true      # B: far below the fast SMA or staying below it
# breakout.exit.fast.below.slow=true    # C: fast SMA crosses below the slow SMA
# breakout.exit.atr.trail=true          # D: ATR trailing stop
# breakout.exit.hard.stop=true          # E: initial hard stop
# Exit B distance / persistence:
# breakout.exit.below.pct=1.5
# breakout.exit.consec.below=2
# Exit C slow SMA:
# breakout.exit.sma.slow=20
# Exit D: trailing stop = highest close since entry - mult * ATR.
# breakout.atr.trail.mult=2.5
# Exit E: initial stop = min(lowest low over lookback, entry - mult * ATR).
# breakout.hard.stop.lookback=10
# breakout.hard.stop.atr.mult=2.0
# Optional partial: book a fraction at the R-multiple target, then trail the rest.
# breakout.partial.enabled=false
# breakout.partial.r.multiple=2.0
# breakout.partial.fraction=0.5
# Sizing, portfolio caps and costs. Each new position is capped at max.weight.pct of
# account equity (and at the free cash), whole shares only, with at most max.positions
# open at once. The per-side cost (basis points) is baked into the fill price: buys pay
# open*(1+cost), sells receive open*(1-cost).
# breakout.capital=1000000
# breakout.max.positions=10
# breakout.max.weight.pct=15
# breakout.cost.bps=0

# Relative paths resolve from the working directory (run from rotation-engine/).
# Path to the input data: a folder of daily OHLCV CSV files ({SYMBOL}.csv with
# header Date,Adj Close,Close,High,Low,Open,Volume).
data.path=../stocks/daily

# Optional CSV (must contain a `symbol` column) to restrict the trading universe.
symbols.file=

# Optional sector diversification. Point sector.file at a CSV with `symbol` and
# `sector` columns (symbols.csv with a sector column works). max.per.sector caps
# how many holdings may come from one sector each rebalance, so two correlated
# same-theme names cannot both fill the book. The engine takes the highest-ranked
# name per sector first and only backfills across the cap if there are not enough
# distinct sectors to fill top.n. Symbols missing from the map are never capped.
# Set max.per.sector=0 (or leave sector.file blank) to disable.
sector.file=../symbols.csv
max.per.sector=1

# Optional single-sector run. When set, only symbols whose sector in sector.file
# matches this value (case-insensitive) are loaded and traded; the run fails if
# none match. Requires sector.file. max.per.sector is ignored while this is set,
# since every name shares one sector. Leave blank to run on all sectors.
# Example: Healthcare
market.sector=

# Output settings.
output.dir=output/rotation
output.prefix=rotation

# Write {prefix}_portal.html: a single self-contained, read-only HTML report (embedded data and
# chart library, opens offline). The daily CSVs and run manifest are always written. Default true.
portal.enabled=true

# Print the per-rebalance runtime log (lookback window, ranking, entries/exits).
verbose=true
