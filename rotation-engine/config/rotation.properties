# ---------------------------------------------------------------------------
# Rotation engine configuration
# All strategy parameters live here. Edit and re-run; no code changes needed.
# ---------------------------------------------------------------------------

# Optional first trading date. All history is still loaded (and exported in the
# snapshots), so the lookback window is already warm on this date and the first
# rebalance executes at the open of the first session on/after it. If this date is
# at the very start of the history, the first rebalance runs on the session after
# momentum.lookback.days sessions of history exist.
# Example: 2023-01-01
# Leave blank to trade from the start of the available dataset.
start.date=2010-01-01
# start.date=

# end.date=2026-01-01
end.date=

# Trading sessions used to rank relative performance (the momentum lookback).
momentum.lookback.days=90

# Number of top-ranked symbols to hold each period.
momentum.top.n=5

# Exit rank threshold / maximum book size. Leave blank or 0 to exit a holding as
# soon as it drops out of momentum.top.n. When set (must be >= momentum.top.n)
# a holding is retained until it falls out of momentum.exit.n, so the book can grow
# up to that many names while older holdings remain inside the buffer.
# Example: momentum.top.n=5, momentum.exit.n=10 -> enter the top 5 and retain
# prior holdings through rank 10, holding up to 10 names.
momentum.exit.n=

# Starting portfolio capital is derived as momentum.capital.per.stock * exit.n (or
# momentum.top.n when momentum.exit.n is unset): each book slot is funded at capacity.
# Only the top momentum.top.n names are entered on first deployment; reserve funds buffer
# slots as they fill. Set the amount per stock below.

# Target capital allocated to each selected stock at the first deployment.
momentum.capital.per.stock=20000

# Optional fixed cash added to the invested principal on the first rebalance of
# each new month (SIP-style top-up). If a rebalance gap skips a calendar month,
# each skipped month is still credited. Only applied in compound allocation mode.
# Set to 0 to disable. Example: 20000
momentum.monthly.contribution=

# Intra-period exit criteria to cap losses BETWEEN scheduled rebalances. Both are
# evaluated on each day's CLOSE while a position is held: if the close breaches a
# stop level the position is sold at the NEXT session's open (never same-day) and
# the proceeds sit in cash until the next scheduled rebalance.
#   stop.loss.pct      - hard stop: exit if the close falls this % below the period entry price
#   trailing.stop.pct  - trailing stop: exit if the close falls this % below its peak close since entry
# When both are set the tighter (higher) level triggers first. Set either to 0 to disable.
momentum.stop.loss.pct=0
momentum.trailing.stop.pct=0

# Rebalance schedule, counted in trading sessions (not calendar dates). The first
# rebalance runs as soon as the lookback window is complete (and not before
# start.date); after that it repeats every N sessions:
#   weekly         - every 5 trading sessions
#   monthly_twice  - every 10 trading sessions (default)
#   monthly        - every 20 trading sessions
# Each switch is decided on the prior session's close and executed at the
# next session's open, so a position can be changed before that day trades.
momentum.rebalance.mode=monthly

# Minimum number of daily bars a symbol must have before it becomes eligible.
# The runner enforces max(momentum.min.history.days, momentum.lookback.days), so a
# symbol is never entered before enough tracked performance exists.
momentum.min.history.days=5

# Portfolio sizing mode:
#   compound         - reinvest the latest portfolio value each rebalance
#   fixed_principal  - redeploy the same principal every rebalance
momentum.allocation.mode=compound

# Active signal strategy. Momentum receives close-only market and holdings views and
# emits order intents; execution/accounting and reporting remain in shared pipeline code.
# Momentum-specific keys use the momentum.* namespace. Momentum is currently the only
# registered strategy.
strategy=momentum

# Relative paths resolve from the working directory (run from rotation-engine/).
# Path to the input data: a folder of daily OHLCV CSV files ({SYMBOL}.csv with
# header Date,Adj Close,Close,High,Low,Open,Volume).
data.path=../stocks/daily

# Optional CSV (must contain a `symbol` column) to restrict the trading universe.
symbols.file=

# Optional sector diversification. Point sector.file at a CSV with `symbol` and
# `sector` columns (symbols.csv with a sector column works). max.per.sector caps
# how many holdings may come from one sector each rebalance, so two correlated
# same-theme names cannot both fill the book. The engine takes the highest-ranked
# name per sector first and only backfills across the cap if there are not enough
# distinct sectors to fill top.n. Symbols missing from the map are never capped.
# Set momentum.max.per.sector=0 (or leave sector.file blank) to disable.
sector.file=../symbols.csv
momentum.max.per.sector=1

# Optional single-sector run. When set, only symbols whose sector in sector.file
# matches this value (case-insensitive) are loaded and traded; the run fails if
# none match. Requires sector.file. momentum.max.per.sector is ignored while this is set,
# since every name shares one sector. Leave blank to run on all sectors.
# Example: Healthcare
market.sector=

# Simple moving averages (DMA) of the adjusted close, computed for each symbol and
# stored with the daily prices: exported as dma_<period> columns in the daily market
# snapshot and readable by strategies via MarketView.dma(symbol, period[, back]).
# Comma-separated positive integers; a value is blank until that many consecutive
# closes exist. Leave blank to disable.
market.dma.periods=10,20,50,100,200

# Source quality checks run after date/universe filters and before snapshot export.
# warn reports missing/invalid bars, jumps over 50%, and 3+ identical valid bars;
# fail stops before export. Neither mode changes prices or trading calculations.
data.validation.mode=warn

# Output settings.
output.dir=output/rotation
output.prefix=rotation

# Write {prefix}_portal.html: a single self-contained, read-only HTML report (embedded data and
# chart library, opens offline). The daily CSVs and run manifest are always written. Default true.
portal.enabled=true

# Print the per-rebalance runtime log (lookback window, ranking, entries/exits).
verbose=true
