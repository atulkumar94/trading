# Phase 0 long-window reference. Keep these strategy and sizing values aligned
# with the active rotation.properties used when this baseline was captured.
lookback.days=90
top.n=5
exit.n=
capital.per.stock=20000
monthly.contribution=
stop.loss.pct=0
trailing.stop.pct=0
rebalance.mode=monthly
min.history.days=5
allocation.mode=compound
strategy=momentum

# Retain all available history from the first data session. Pin the inclusive
# end date so later source-data additions cannot change the reference run.
data.path=../stocks/daily
start.date=2010-01-01
end.date=2026-09-30

# Match the current full-universe sector filter. Leave symbol and single-sector
# restrictions unset so the baseline covers the configured broad universe.
symbols.file=
sector.file=../symbols.csv
max.per.sector=1
market.sector=

# Main writes the full run here; BaselineCompare captures the seven gate reports.
# Portal and verbose logging do not affect reports and are disabled for the run.
output.dir=output/baseline-capture-long
output.prefix=rotation
portal.enabled=false
verbose=false